schemaVersion: achworks.dev/v1alpha1
kind: Component

metadata:
  name: wp-native-builder
  title: WP Native Builder
  description: ChatGPT Skill for stack-adaptive WordPress planning, native-first implementation, review, Gutenberg safety, and project continuity.

spec:
  type: ai-engineering-skill
  lifecycle: active
  system: wordpress-ai
  ownership: AChWorks

  capabilities:
    provides:
      - wordpress-site-planning
      - wordpress-native-implementation
      - gutenberg-safety
      - wordpress-site-review
      - workspace-project-continuity
    consumes:
      - wordpress
      - validation-evidence-contract
      - external-effect-safety-contract

  documentation:
    path: docs/

  source:
    repository: AChWorks/wp-native-builder
    url: https://github.com/AChWorks/wp-native-builder

  extensions:
    achworks:
      koinon: AChWorks/koinon
